<!-- =============================================================================
     Twikoo 留言区(基于腾讯云开发 CloudBase)
     文档:https://twikoo.js.org
     说明:envId 需要在腾讯云开发一键部署 Twikoo 后填入(见下方说明)。
     优势:评论数据存腾讯云,国内访问快,支持匿名评论。
     ============================================================================= -->
<section class="post-comments">
  <h2 class="comments-title">留言</h2>
  <div id="twikoo"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/twikoo@1.7.22/dist/twikoo.all.min.js"></script>
<script>
  // 根据当前博客主题初始化/刷新 Twikoo
  window.initTwikoo = function () {
    if (typeof twikoo === 'undefined') return;
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var container = document.getElementById('twikoo');
    if (!container) return;
    // 清空容器,切换主题时干净地重新初始化
    container.innerHTML = '';
    twikoo.init({
      envId: 'blog-comment-d8govtixo1a88b506',
      el: '#twikoo',
      lang: 'zh-CN',
      darkmode: isDark,
    });
  };

  // Twikoo 脚本加载完成后初始化(经典脚本按顺序执行,此处 twikoo 已就绪)
  window.initTwikoo();
</script>
