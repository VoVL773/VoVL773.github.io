<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/archive/' | relative_url }}">归档</a>
      <a href="{{ '/tags/' | relative_url }}">标签</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>

    <!-- 主题切换按钮:初始图标(🌙/☀️)由 theme.js 根据 data-theme 设置,
         这样不会与 default.html 里的防闪烁脚本冲突。 -->
    <div class="header-actions">
      <button id="banner-toggle" class="banner-toggle" aria-label="切换 Banner 图片" title="切换 Banner 图片" type="button">🖼️</button>
      <button id="theme-toggle" class="theme-toggle" aria-label="切换主题" type="button">🌙</button>
    </div>
  </div>
</header>
