---
layout: default
---
<article class="project-detail">
  <a class="project-back" href="{{ '/projects/' | relative_url }}">← 返回项目列表</a>

  {% if page.cover %}
  <div class="project-detail-cover">
    <img src="{{ page.cover | relative_url }}" alt="{{ page.title }}" onerror="this.src='{{ '/assets/images/demo/default-cover.png' | relative_url }}'">
  </div>
  {% endif %}

  <header class="project-detail-head">
    <h1 class="project-detail-title">{{ page.title }}</h1>
    <div class="project-detail-meta">
      {% if page.tags.size > 0 %}
      <div class="project-tags">
        {% for tag in page.tags %}<span class="project-tag">{{ tag }}</span>{% endfor %}
      </div>
      {% endif %}
      {% if page.github %}
      <a class="project-github-btn" href="{{ page.github }}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0112 6.8c.85 0 1.71.11 2.51.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10.01 10.01 0 0022 12c0-5.52-4.48-10-10-10z"/></svg>
        GitHub 仓库
      </a>
      {% endif %}
    </div>
  </header>

  <div class="project-detail-content">
    {{ content }}
  </div>
</article>
