<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 站点图标(Favicon) -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <title>
    {% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>

  <!-- ===== 防闪烁脚本(必须内联在 head 早期、CSS 之前)=====
       作用:在浏览器首次绘制页面前,根据已保存的偏好设置暗色主题。
       为什么必须内联:外链 JS 会延迟加载,会先闪一下白色再变暗;
       内联同步脚本在首次绘制前执行,所以不会闪。 -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (saved === null && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- ===== Banner 预设图列表(由 Jekyll 处理 relative_url,兼容 baseurl)===== -->
  <script>
    // 预设图路径用 relative_url 处理,项目站点(baseurl 非空)时也能正确加载。
    // theme.js 会从 window.bannerPresets 读取列表进行循环切换。
    window.bannerPresets = [
      '{{ "/assets/images/0.jpg" | relative_url }}',
      '{{ "/assets/images/1.jpg" | relative_url }}',
      '{{ "/assets/images/2.png" | relative_url }}'
    ];
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {% include header.html %}

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <!-- 主题切换按钮的交互逻辑(外链,defer 延迟加载,不影响首屏) -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
