---
layout: algorithm
---
<article class="algo-detail">
  <a class="algo-back" href="{{ '/algorithm/insights/' | relative_url }}">← 返回见解列表</a>

  <header class="algo-problem-head">
    <h1 class="algo-problem-title">{{ page.title }}</h1>
    <div class="algo-problem-meta">
      {% if page.date %}
      <time class="algo-insight-date">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% endif %}
      {% if page.tags.size > 0 %}
      <div class="algo-card-tags">
        {% for tag in page.tags %}<span class="algo-tag">{{ tag }}</span>{% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <div class="algo-problem-content">
    {{ content }}
  </div>
</article>
