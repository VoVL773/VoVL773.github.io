# =============================================================================
# Jekyll 站点配置文件
# 文档:https://jekyllrb.com/docs/configuration/
# =============================================================================

# ===== 站点基本信息(请替换为你的信息)=====
title: VoVL的博客
description: 间接性踌躇满志，持续性记录生活。
author: VoVL773
home_intro: 记录 ROS 2、机器视觉与机器人仿真实践，也分享 Python 和算法学习笔记。
# 填写 B 站个人主页完整地址后，页脚自动显示入口。
bilibili_url: "https://space.bilibili.com/3546792683637323"

# ===== URL(部署到 GitHub Pages 后替换,二选一)=====
# 情况 A:用户站点(仓库名必须为 your-username.github.io)
#   访问地址:https://your-username.github.io
url: "https://VoVL773.github.io"
baseurl: ""

# 情况 B:项目站点(仓库名任意,如 your-blog-repo)
#   访问地址:https://your-username.github.io/your-blog-repo
# url: "https://your-username.github.io"
# baseurl: "/your-blog-repo"
# 注意:baseurl 不要带结尾斜杠

# ===== 构建相关 =====
markdown: kramdown                              # GitHub Pages 默认 Markdown 引擎,勿改
highlighter: rouge                              # 默认代码高亮,勿改
permalink: /:year/:month/:day/:title/           # 文章 URL 风格(如 /2026/09/01/标题/)
theme: null                                     # 不使用外部主题,全部布局自写

# ===== 插件(仅 GitHub Pages 白名单内可用)=====
plugins: []

# ===== 分页 =====
# 首页不再使用服务端分页,全部文章页(/posts/)使用客户端 JS 分页

# ===== 自定义集合(Collections)=====
# 和 _posts 机制一样:往对应目录丢 .md 文件,Jekyll 自动收集。
# 题解目录 → _problems/   见解目录 → _insights/   项目目录 → _projects/
# (目录前的下划线是 Jekyll 集合约定,和 _posts 一样)
collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/
  problems:
    output: true
    permalink: /algorithm/problem/:name/
  insights:
    output: true
    permalink: /algorithm/insights/:name/
  projects:
    output: true
    permalink: /projects/:name/

# ===== 默认布局(自动给文章/页面赋 layout,减少 front matter 重复)=====
defaults:
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "tutorial"
  - scope:
      path: ""           # 所有路径
      type: "posts"      # 仅对 _posts 下的文章生效
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"      # 仅对页面(index/about/archive/tags)生效
    values:
      layout: "page"
  - scope:
      path: ""
      type: "problems"   # 题解集合自动套用 problem 布局
    values:
      layout: "problem"
  - scope:
      path: ""
      type: "insights"   # 见解集合自动套用 insight 布局
    values:
      layout: "insight"
  - scope:
      path: ""
      type: "projects"   # 项目集合自动套用 project 布局
    values:
      layout: "project"

# ===== 杂项 =====
lang: zh-CN
